name = "primalmacro-scanner"
main = "src/worker.js"
compatibility_date = "2026-10-01"
preview_urls = false

[vars]
SCANS_ENABLED = "false"
APP_STORE_ENVIRONMENT = "Sandbox"
SCAN_USER_DAILY_LIMIT = "3"
SCAN_DAILY_LIMIT = "25"
SCAN_TOTAL_LIMIT = "100"

# Approximate POP-local throttle. Durable Object quotas are authoritative.
[[ratelimits]]
name = "SCAN_RATE_LIMIT"
namespace_id = "1901"
  [ratelimits.simple]
  limit = 10
  period = 60

[[durable_objects.bindings]]
name = "SCAN_STATE"
class_name = "ScanState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanState"]
