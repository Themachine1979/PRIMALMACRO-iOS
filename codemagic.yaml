# PRIMALMACRO iOS - unsigned checks and a manually started TestFlight archive.
workflows:
  primalmacro-ios-check:
    name: PRIMALMACRO - iOS compile check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 24
    scripts:
      - name: Check Xcode project and scheme
        script: |
          test -f "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj/project.pbxproj" || {
            echo "PRIMALMACRO.xcodeproj is missing from the repository root. Upload the full extracted Xcode project, including its folders."
            exit 1
          }
          xcodebuild -list -project "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj"
      - name: Run local nutrition and Worker tests
        script: |
          set -e
          xcrun swiftc PRIMALMACRO/Models.swift PRIMALMACRO/NutritionMath.swift tests/NutritionMathTests.swift -o /tmp/primalmacro-nutrition-tests
          /tmp/primalmacro-nutrition-tests
          (cd backend && npm test)
      - name: Compile for iPhone simulator (no signing)
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj" \
            -scheme "PRIMALMACRO" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  primalmacro-ios-testflight:
    name: PRIMALMACRO - signed TestFlight archive
    max_build_duration: 90
    instance_type: mac_mini_m2
    # This integration name must exactly match the API key name in
    # Codemagic account settings > Developer Portal integrations.
    inputs:
      buildNumber:
        description: Unused PRIMALMACRO iOS build number from App Store Connect
        type: number
    integrations:
      app_store_connect: "PRIMALMACRO Codemagic"
    environment:
      groups:
        - primalmacro_scanner
      vars:
        PM_BUILD_NUMBER: "${{ inputs.buildNumber }}"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.themachine1979.primalmacro
      xcode: latest
    scripts:
      - name: Verify PRIMALMACRO project exists
        script: |
          test -f "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj/project.pbxproj" || {
            echo "Missing native Xcode project in repository root."
            exit 1
          }
      - name: Set build number and optional AI scanner endpoint
        script: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          url = os.environ.get("PM_SCANNER_URL", "").strip()
          project = Path("PRIMALMACRO.xcodeproj/project.pbxproj")
          source = project.read_text()
          build = os.environ.get("PM_BUILD_NUMBER", "")
          if not re.fullmatch(r"[1-9][0-9]*", build):
              raise SystemExit("Enter an unused positive whole number in the Codemagic build number field")
          source, count = re.subn(r"CURRENT_PROJECT_VERSION = [0-9]+;", f"CURRENT_PROJECT_VERSION = {build};", source)
          if count != 2:
              raise SystemExit("Expected build number in both Xcode configurations")
          if url and not re.fullmatch(r"https://[a-zA-Z0-9.-]+/scan", url):
              raise SystemExit("PM_SCANNER_URL must be a full HTTPS URL ending in /scan")
          placeholder = "PM_SCANNER_ENDPOINT_PLACEHOLDER"
          if source.count(placeholder) != 2:
              raise SystemExit("Expected scanner placeholder in both Xcode configurations")
          # Firebase Web API keys are client-visible identifiers, not passwords.
          # A missing key keeps email registration safely disabled in the app.
          firebase_key = os.environ.get("PM_FIREBASE_API_KEY", "").strip()
          if firebase_key and not re.fullmatch(r"[A-Za-z0-9_-]{30,80}", firebase_key):
              raise SystemExit("PM_FIREBASE_API_KEY must be a valid Firebase Web API key")
          if source.count("PM_FIREBASE_API_KEY_PLACEHOLDER") != 2:
              raise SystemExit("Expected Firebase placeholder in both Xcode configurations")
          source = source.replace("PM_FIREBASE_API_KEY_PLACEHOLDER", firebase_key or "PM_FIREBASE_API_KEY_PLACEHOLDER")
          project.write_text(source.replace(placeholder, url))
          PY
      - name: Apply Apple distribution provisioning profile
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Create signed iPhone IPA
        script: |
          if xcode-project build-ipa --disable-xcpretty \
            --project "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj" \
            --scheme "PRIMALMACRO"; then
            exit 0
          else
            archive_status=$?
            echo "Xcode diagnostics from /tmp/xcodebuild_logs"
            found_log=false
            for log in /tmp/xcodebuild_logs/PRIMALMACRO*.log; do
              [ -f "$log" ] || continue
              found_log=true
              echo "--- $log ---"
              grep -niE '(^|[[:space:]])(fatal )?error:|provisioning profile.*(doesn.t|does not|missing|expired)|\*\* (ARCHIVE|EXPORT) FAILED \*\*' "$log" | head -n 30 || true
            done
            if [ "$found_log" = false ]; then
              echo "No raw Xcode log was found."
            fi
            exit "$archive_status"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # MANUAL OPT-IN: do not run without explicit owner approval.
  primalmacro-ios-upload-internal:
    name: PRIMALMACRO - upload to App Store Connect (manual)
    max_build_duration: 90
    instance_type: mac_mini_m2
    # This integration name must exactly match the API key name in
    # Codemagic account settings > Developer Portal integrations.
    inputs:
      buildNumber:
        description: Unused PRIMALMACRO iOS build number from App Store Connect
        type: number
      approveUpload:
        description: I approve uploading this newly built IPA to App Store Connect
        type: boolean
        default: false
    integrations:
      app_store_connect: "PRIMALMACRO Codemagic"
    environment:
      groups:
        - primalmacro_scanner
      vars:
        PM_BUILD_NUMBER: "${{ inputs.buildNumber }}"
        PM_UPLOAD_APPROVED: "${{ inputs.approveUpload }}"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.themachine1979.primalmacro
      xcode: latest
    scripts:
      - name: Require explicit App Store Connect upload approval
        script: |
          case "${PM_UPLOAD_APPROVED:-false}" in
            true|True|TRUE) echo "Upload approved for this manually started build." ;;
            *) echo "Upload approval is not checked. No IPA will be built or uploaded."; exit 1 ;;
          esac
      - name: Verify PRIMALMACRO project exists
        script: |
          test -f "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj/project.pbxproj" || {
            echo "Missing native Xcode project in repository root."
            exit 1
          }
      - name: Set build number and optional AI scanner endpoint
        script: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          url = os.environ.get("PM_SCANNER_URL", "").strip()
          project = Path("PRIMALMACRO.xcodeproj/project.pbxproj")
          source = project.read_text()
          build = os.environ.get("PM_BUILD_NUMBER", "")
          if not re.fullmatch(r"[1-9][0-9]*", build):
              raise SystemExit("Enter an unused positive whole number in the Codemagic build number field")
          source, count = re.subn(r"CURRENT_PROJECT_VERSION = [0-9]+;", f"CURRENT_PROJECT_VERSION = {build};", source)
          if count != 2:
              raise SystemExit("Expected build number in both Xcode configurations")
          if url and not re.fullmatch(r"https://[a-zA-Z0-9.-]+/scan", url):
              raise SystemExit("PM_SCANNER_URL must be a full HTTPS URL ending in /scan")
          placeholder = "PM_SCANNER_ENDPOINT_PLACEHOLDER"
          if source.count(placeholder) != 2:
              raise SystemExit("Expected scanner placeholder in both Xcode configurations")
          # Firebase Web API keys are client-visible identifiers, not passwords.
          # A missing key keeps email registration safely disabled in the app.
          firebase_key = os.environ.get("PM_FIREBASE_API_KEY", "").strip()
          if firebase_key and not re.fullmatch(r"[A-Za-z0-9_-]{30,80}", firebase_key):
              raise SystemExit("PM_FIREBASE_API_KEY must be a valid Firebase Web API key")
          if source.count("PM_FIREBASE_API_KEY_PLACEHOLDER") != 2:
              raise SystemExit("Expected Firebase placeholder in both Xcode configurations")
          source = source.replace("PM_FIREBASE_API_KEY_PLACEHOLDER", firebase_key or "PM_FIREBASE_API_KEY_PLACEHOLDER")
          project.write_text(source.replace(placeholder, url))
          PY
      - name: Apply Apple distribution provisioning profile
        script: |
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Create signed iPhone IPA
        script: |
          if xcode-project build-ipa --disable-xcpretty \
            --project "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj" \
            --scheme "PRIMALMACRO"; then
            exit 0
          else
            archive_status=$?
            echo "Xcode diagnostics from /tmp/xcodebuild_logs"
            found_log=false
            for log in /tmp/xcodebuild_logs/PRIMALMACRO*.log; do
              [ -f "$log" ] || continue
              found_log=true
              echo "--- $log ---"
              grep -niE '(^|[[:space:]])(fatal )?error:|provisioning profile.*(doesn.t|does not|missing|expired)|\*\* (ARCHIVE|EXPORT) FAILED \*\*' "$log" | head -n 30 || true
            done
            if [ "$found_log" = false ]; then
              echo "No raw Xcode log was found."
            fi
            exit "$archive_status"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # This workflow has NO automatic triggers. It uploads to Apple only when the
    # owner selects it manually AND ticks the approval input for that build.
    publishing:
      app_store_connect:
        auth: integration
        # Upload the IPA only; do not submit to beta review or App Store review.
        # Assignment to a named internal TestFlight tester group is done by the owner.
        submit_to_testflight: false
        submit_to_app_store: false

  # MANUAL APP STORE RELEASE: upload only with the owner's explicit approval.
  primalmacro-ios-upload-appstore:
    name: PRIMALMACRO - v1.1 App Store IPA upload (manual, after v1.0 approval)
    max_build_duration: 90
    instance_type: mac_mini_m2
    # This integration name must exactly match the API key name in
    # Codemagic account settings > Developer Portal integrations.
    inputs:
      buildNumber:
        description: New App Store release build number (e.g. 14; not used before)
        type: number
      approveUpload:
        description: I approve uploading this newly built IPA to App Store Connect
        type: boolean
        default: false
    integrations:
      app_store_connect: "PRIMALMACRO Codemagic"
    environment:
      groups:
        - primalmacro_scanner
      vars:
        PM_BUILD_NUMBER: "${{ inputs.buildNumber }}"
        PM_UPLOAD_APPROVED: "${{ inputs.approveUpload }}"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.themachine1979.primalmacro
      xcode: latest
    scripts:
      - name: Require explicit App Store Connect upload approval
        script: |
          case "${PM_UPLOAD_APPROVED:-false}" in
            true|True|TRUE) echo "Upload approved for this manually started build." ;;
            *) echo "Upload approval is not checked. No IPA will be built or uploaded."; exit 1 ;;
          esac
      - name: Verify PRIMALMACRO project exists
        script: |
          test -f "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj/project.pbxproj" || {
            echo "Missing native Xcode project in repository root."
            exit 1
          }
      - name: Set App Store version 1.1, build number and scanner endpoint
        script: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          url = os.environ.get("PM_SCANNER_URL", "").strip()
          project = Path("PRIMALMACRO.xcodeproj/project.pbxproj")
          source = project.read_text()
          build = os.environ.get("PM_BUILD_NUMBER", "")
          if not re.fullmatch(r"[1-9][0-9]*", build):
              raise SystemExit("Enter an unused positive whole number in the Codemagic build number field")
          # This workflow is for the NEXT update after Apple's existing 1.0 review.
          source, versions = re.subn(r"MARKETING_VERSION = [0-9.]+;", "MARKETING_VERSION = 1.1;", source)
          if versions != 2:
              raise SystemExit("Expected marketing version in both Xcode configurations")
          source, count = re.subn(r"CURRENT_PROJECT_VERSION = [0-9]+;", f"CURRENT_PROJECT_VERSION = {build};", source)
          if count != 2:
              raise SystemExit("Expected build number in both Xcode configurations")
          if not re.fullmatch(r"https://[a-zA-Z0-9.-]+/scan", url):
              raise SystemExit("The App Store release requires PM_SCANNER_URL (HTTPS, ending /scan)")
          placeholder = "PM_SCANNER_ENDPOINT_PLACEHOLDER"
          if source.count(placeholder) != 2:
              raise SystemExit("Expected scanner placeholder in both Xcode configurations")
          # Firebase Web API keys are client-visible identifiers, not passwords.
          # A missing key keeps email registration safely disabled in the app.
          firebase_key = os.environ.get("PM_FIREBASE_API_KEY", "").strip()
          if not firebase_key:
              raise SystemExit("Firebase email/password must be configured before release: set PM_FIREBASE_API_KEY")
          if firebase_key and not re.fullmatch(r"[A-Za-z0-9_-]{30,80}", firebase_key):
              raise SystemExit("PM_FIREBASE_API_KEY must be a valid Firebase Web API key")
          if source.count("PM_FIREBASE_API_KEY_PLACEHOLDER") != 2:
              raise SystemExit("Expected Firebase placeholder in both Xcode configurations")
          source = source.replace("PM_FIREBASE_API_KEY_PLACEHOLDER", firebase_key or "PM_FIREBASE_API_KEY_PLACEHOLDER")
          project.write_text(source.replace(placeholder, url))
          PY
      - name: Apply Apple distribution provisioning profile
        script: |
          # Public App Store release: DO NOT mark this IPA internal-testing-only.
          xcode-project use-profiles
      - name: Create signed iPhone IPA
        script: |
          if xcode-project build-ipa --disable-xcpretty \
            --project "$CM_BUILD_DIR/PRIMALMACRO.xcodeproj" \
            --scheme "PRIMALMACRO"; then
            exit 0
          else
            archive_status=$?
            echo "Xcode diagnostics from /tmp/xcodebuild_logs"
            found_log=false
            for log in /tmp/xcodebuild_logs/PRIMALMACRO*.log; do
              [ -f "$log" ] || continue
              found_log=true
              echo "--- $log ---"
              grep -niE '(^|[[:space:]])(fatal )?error:|provisioning profile.*(doesn.t|does not|missing|expired)|\*\* (ARCHIVE|EXPORT) FAILED \*\*' "$log" | head -n 30 || true
            done
            if [ "$found_log" = false ]; then
              echo "No raw Xcode log was found."
            fi
            exit "$archive_status"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    # No automatic triggers or review submission; an owner must start this workflow
    # and tick its upload approval for each build.
    publishing:
      app_store_connect:
        auth: integration
        # Upload a public-release-eligible IPA only. Review is submitted manually
        # in App Store Connect after the owner confirms version and screenshots.
        submit_to_testflight: false
        submit_to_app_store: false
