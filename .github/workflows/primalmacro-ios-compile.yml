name: PRIMALMACRO iOS feature compile

on:
  push:
    branches:
      - feature/primalmacro-v1.1-combined
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift nutrition unit tests
        run: |
          swiftc PRIMALMACRO/Models.swift PRIMALMACRO/NutritionMath.swift tests/NutritionMathTests.swift -o /tmp/primalmacro-nutrition-tests
          /tmp/primalmacro-nutrition-tests
      - name: Compile iPhone simulator without signing
        run: |
          xcodebuild -project PRIMALMACRO.xcodeproj -scheme PRIMALMACRO -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Cloudflare Worker
        working-directory: backend
        run: node --test test/*.test.js
